spring.application.name=orynix

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/orynix}
spring.datasource.username=${DB_USERNAME:orynix}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}
jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TOKEN_TTL_SECONDS:2592000}

management.endpoints.web.exposure.include=health
