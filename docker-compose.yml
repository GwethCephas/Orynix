services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orynix
      POSTGRES_USER: orynix
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD before starting}
    ports:
      - "5432:5432"
    volumes:
      - orynix-postgres-data:/var/lib/postgresql/data

volumes:
  orynix-postgres-data:
